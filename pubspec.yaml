name: greenloop
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # UI & UX
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0        # ✅ Added for custom fonts

  # Navigation & URL handling
  url_strategy: ^0.3.0

  # Backend
  supabase_flutter: ^2.8.4

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^8.0.3

  # Utilities
  dartz: ^0.10.1
  uuid: ^4.5.1
  shared_preferences: any     # Consider pinning version if needed

  # UI enhancements
  smooth_page_indicator: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
